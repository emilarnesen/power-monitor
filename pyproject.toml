[project]
name = "power-monitor"
version = "0.1.0"
description = "Collects Tibber Pulse, spot price and grid tariff data into Grafana Cloud and Postgres"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "websockets>=13",
]

[project.scripts]
power-backfill = "power_monitor.backfill:main"
power-collector = "power_monitor.collector:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
